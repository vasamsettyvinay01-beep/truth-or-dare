services:
  - type: web
    name: truth-or-dare-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w shared && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "4001"
      - key: CLIENT_ORIGIN
        sync: false
